# Build system
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Project metadata
[project]
name = "supportops-rag-agent"
version = "0.1.0"
description = "AI-powered support assistant with RAG and tool calling"
readme = "README.md"
requires-python = ">=3.12"

# Application dependencies
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
    "mypy",
]

# Package discovery
[tool.setuptools.packages.find]
where = ["src"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py312"
